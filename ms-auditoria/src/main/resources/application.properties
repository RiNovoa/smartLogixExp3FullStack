# Puerto del servidor web ms-auditoria
server.port=8082

# El nombre de la aplicación
spring.application.name=ms-auditoria

# Conexion a la base de datos MySQL con XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/db_auditoria?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true