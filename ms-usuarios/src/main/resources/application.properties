# Puerto del servidor web para ms-usuarios
server.port=8081

# Nombre de la aplicación
spring.application.name=ms-usuarios

# Conexión a MySQL con XAMPP (creará la base de datos automáticamente)
spring.datasource.url=jdbc:mysql://localhost:3306/db_usuarios?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true